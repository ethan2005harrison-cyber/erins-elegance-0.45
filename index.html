<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>erin’s elegance</title>

  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4150/4150897.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Open+Sans:wght@300;400;600&display=swap');

    :root{
      --cream:#FDF9F4;
      --green:#1F3524;
      --gold:#B8935A;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      font-family:'Open Sans',sans-serif;
      background: var(--cream);
      color: var(--green);
      overflow-x:hidden;
    }

    /* HEADER */
    header{
      background: var(--cream);
      border-bottom: 1px solid rgba(184,147,90,.3);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 20;
    }

    .header-container{
      max-width: 1200px;
      margin: 0 auto;
      display:flex;
      justify-content:flex-end;
      align-items:center;
      padding: .6rem 1.2rem;
    }

    /* MENU */
    .menu{ position:relative; }

    .menu-panel{
      position:absolute;
      right:0;
      top: calc(100% + .5rem);
      background: var(--cream);
      border:1px solid var(--gold);
      border-radius: 16px;
      min-width: 210px;
      padding:.5rem;
      box-shadow: 0 12px 28px rgba(31,53,36,.15);
      opacity:0;
      transform: translateY(-6px);
      pointer-events:none;
      transition:.2s;
    }

    .menu-panel.open{
      opacity:1;
      transform: translateY(0);
      pointer-events:auto;
    }

    .menu-panel a{
      display:block;
      padding:.65rem .9rem;
      border-radius: 12px;
      text-decoration:none;
      color: var(--green);
      font-weight:600;
      font-size:.95rem;
    }

    .menu-panel a:hover{
      background: rgba(184,147,90,.15);
    }

    /* HERO */
    main{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding: 3.5rem 1.2rem .5rem;
    }

    .hero-logo{
      width: min(360px, 80vw);
      max-height: 38vh;
      object-fit: contain;
      height: auto;
      margin: 0 auto .8rem;
      display:block;

      /* softly fades the very edges of the image so no box shows */
      -webkit-mask-image:
        linear-gradient(to right, transparent, #000 4%, #000 96%, transparent),
        linear-gradient(to bottom, transparent, #000 4%, #000 96%, transparent);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to right, transparent, #000 4%, #000 96%, transparent),
        linear-gradient(to bottom, transparent, #000 4%, #000 96%, transparent);
      mask-composite: intersect;

      opacity:0;
      transform: translateY(-20px);
      animation: fadeUp 1s forwards .3s;
    }

    .actions{
      display:flex;
      gap:.6rem;
      justify-content:center;
      flex-wrap:wrap;
    }

    /* ALL BUTTONS (including Menu) */
    button{
      background-color: var(--green);
      color: var(--cream);
      border: 1px solid var(--green);
      padding: .65rem 1.4rem;
      border-radius: 50px;
      font-size: .9rem;
      cursor: pointer;
      font-weight:600;
      box-shadow:0 4px 14px rgba(31,53,36,.18);
      transition:.2s;
    }

    button:hover{
      background-color: var(--gold);
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    @keyframes fadeUp{
      to{ opacity:1; transform: translateY(0); }
    }

    /* FOOTER */
    footer{
      text-align:center;
      padding:.6rem 1rem .8rem;
      font-size:.8rem;
      color: var(--green);
      opacity:.85;
    }

    footer p{ margin:.1rem 0; }
  </style>
</head>

<body>

<header>
  <div class="header-container">
    <div class="menu">
      <button class="menu-btn" id="menuButton">Menu</button>

      <nav id="primaryMenu" class="menu-panel">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="booking.html">Booking</a>
        <a href="about.html">About Our Service</a>
        <a href="terms.html">Terms & Conditions</a>
      </nav>
    </div>
  </div>
</header>

<main>
  <img src="assets/edited-photo.png" alt="Erin’s Elegance logo" class="hero-logo">

  <div class="actions">
    <button onclick="location.href='services.html'">View Services</button>
    <button onclick="location.href='about.html'">About Our Service</button>
    <button onclick="location.href='booking.html'">Book Now</button>
  </div>
</main>

<footer>
  <p>© 2025 erin’s elegance. all rights reserved.</p>
  <p>16 Werrington Drive, Callington, Cornwall, PL17 7TF</p>
</footer>

<script>
  const btn = document.getElementById('menuButton');
  const panel = document.getElementById('primaryMenu');

  btn.addEventListener('click', () => {
    panel.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if(!panel.contains(e.target) && e.target !== btn){
      panel.classList.remove('open');
    }
  });
</script>

</body>
</html>
